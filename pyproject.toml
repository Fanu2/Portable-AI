[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portable-ai"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "PySide6>=6.11",
    "transformers>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
